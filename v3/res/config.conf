# NSI example site configuration
# Format:
#   key = value
# Notes:
# - Blank lines and full-line comments are ignored.
# - Booleans accept true/false, yes/no, on/off, or 1/0.
# - List values are comma-separated and may be quoted if needed.

# Basic site information
site_name = NSI Development Repository 
organization = NFINIT labs
home_page_title = Home

# Presentation style
nav_position = top
auto_rule = true
auto_rule_elements = intro, body, toc, navigation, footer

# Advanced features
api_enabled = false
debug_trace = false
